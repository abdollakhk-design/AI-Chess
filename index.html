<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI-Chess</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101417;
      --panel: #1c2327;
      --panel-2: #242c30;
      --line: #3b464b;
      --text: #eef3ef;
      --muted: #aab5b0;
      --light: #e6d7b8;
      --dark: #6e8f73;
      --select: #f4c542;
      --move: #2d6cdf;
      --danger: #d95f55;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 28px 18px;
      display: grid;
      grid-template-columns: minmax(320px, 680px) minmax(280px, 360px);
      gap: 24px;
      align-items: start;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 68px);
      line-height: 0.95;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 16px;
      max-width: 660px;
      line-height: 1.45;
    }

    .board-wrap {
      width: 100%;
    }

    .board {
      width: min(100%, 680px);
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      border: 1px solid var(--line);
      background: var(--line);
    }

    .square {
      border: 0;
      padding: 0;
      display: grid;
      place-items: center;
      position: relative;
      font-size: clamp(28px, 7vw, 58px);
      line-height: 1;
      cursor: pointer;
      user-select: none;
      color: #171b1d;
    }

    .square.light {
      background: var(--light);
    }

    .square.dark {
      background: var(--dark);
    }

    .square.selected::after {
      content: "";
      position: absolute;
      inset: 7%;
      border: 4px solid var(--select);
      pointer-events: none;
    }

    .square.legal::before {
      content: "";
      width: 24%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--move);
      opacity: 0.75;
      position: absolute;
    }

    .square.capture::before {
      width: 74%;
      background: transparent;
      border: 4px solid var(--move);
    }

    .piece-white {
      color: #f8f8f4;
      text-shadow: 0 2px 0 #141414, 0 0 2px #141414;
    }

    .piece-black {
      color: #141414;
      text-shadow: 0 1px 0 #f5f1e8;
    }

    .side {
      display: grid;
      gap: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      background: var(--panel);
      padding: 16px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    .status {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.25;
    }

    .muted {
      color: var(--muted);
      line-height: 1.45;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .stat {
      background: var(--panel-2);
      border: 1px solid var(--line);
      padding: 12px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
    }

    .controls {
      display: grid;
      gap: 10px;
    }

    label {
      color: var(--muted);
      font-size: 14px;
    }

    select,
    button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      font: inherit;
      padding: 10px 12px;
    }

    button {
      cursor: pointer;
      font-weight: 700;
    }

    button:hover,
    select:hover {
      border-color: var(--text);
    }

    .danger {
      color: #fff;
      background: var(--danger);
      border-color: var(--danger);
    }

    .moves {
      max-height: 220px;
      overflow: auto;
      margin: 0;
      padding-left: 22px;
      color: var(--muted);
      line-height: 1.7;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
      }

      header {
        display: block;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>AI-Chess</h1>
        <p class="subtitle">Пайдаланушы деңгейіне қарай бейімделетін браузерлік шахмат ойыны.</p>
      </div>
    </header>

    <section class="board-wrap" aria-label="Chess board">
      <div id="board" class="board"></div>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>Ойын күйі</h2>
        <div id="status" class="status">Жүктеліп жатыр...</div>
        <p id="hint" class="muted">Ақ фигурамен ойнайсыз. Фигураны, сосын жүретін ұяшықты басыңыз.</p>
      </section>

      <section class="panel">
        <h2>Деңгей</h2>
        <div class="controls">
          <label for="level">AI қиындығы</label>
          <select id="level">
            <option value="1">Beginner</option>
            <option value="2">Intermediate</option>
            <option value="3">Advanced</option>
          </select>
          <button id="newGame" type="button">Жаңа ойын</button>
          <button id="clearStats" class="danger" type="button">Статистиканы тазалау</button>
        </div>
      </section>

      <section class="panel">
        <h2>Статистика</h2>
        <div class="stats">
          <div class="stat"><strong id="games">0</strong><span class="muted">Ойын</span></div>
          <div class="stat"><strong id="wins">0</strong><span class="muted">Жеңіс</span></div>
          <div class="stat"><strong id="losses">0</strong><span class="muted">Жеңіліс</span></div>
          <div class="stat"><strong id="draws">0</strong><span class="muted">Тең</span></div>
        </div>
      </section>

      <section class="panel">
        <h2>Жүрістер</h2>
        <ol id="moves" class="moves"></ol>
      </section>
    </aside>
  </main>

  <script type="module">
    import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/+esm";

    const boardEl = document.querySelector("#board");
    const statusEl = document.querySelector("#status");
    const hintEl = document.querySelector("#hint");
    const movesEl = document.querySelector("#moves");
    const levelEl = document.querySelector("#level");
    const newGameEl = document.querySelector("#newGame");
    const clearStatsEl = document.querySelector("#clearStats");
    const statEls = {
      games: document.querySelector("#games"),
      wins: document.querySelector("#wins"),
      losses: document.querySelector("#losses"),
      draws: document.querySelector("#draws"),
    };

    const pieceSymbols = {
      w: { p: "♙", r: "♖", n: "♘", b: "♗", q: "♕", k: "♔" },
      b: { p: "♟", r: "♜", n: "♞", b: "♝", q: "♛", k: "♚" },
    };
    const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
    const files = ["a", "b", "c", "d", "e", "f", "g", "h"];
    const storageKey = "ai-chess-browser-stats";

    let game;
    let selected = null;
    let legalTargets = [];
    let recorded = false;
    let stats = loadStats();

    function createGame() {
      game = new Chess();
      selected = null;
      legalTargets = [];
      recorded = false;
      levelEl.value = String(stats.level);
      render();
    }

    function loadStats() {
      const fallback = { games: 0, wins: 0, losses: 0, draws: 0, level: 1 };
      try {
        return { ...fallback, ...JSON.parse(localStorage.getItem(storageKey)) };
      } catch {
        return fallback;
      }
    }

    function saveStats() {
      localStorage.setItem(storageKey, JSON.stringify(stats));
    }

    function adaptLevel() {
      if (stats.games < 3) return stats.level;
      const winRate = stats.wins / stats.games;
      if (winRate >= 0.66) return Math.min(3, stats.level + 1);
      if (winRate <= 0.33) return Math.max(1, stats.level - 1);
      return stats.level;
    }

    function render() {
      boardEl.innerHTML = "";
      const board = game.board();

      for (let rank = 0; rank < 8; rank += 1) {
        for (let file = 0; file < 8; file += 1) {
          const squareName = files[file] + (8 - rank);
          const piece = board[rank][file];
          const square = document.createElement("button");
          square.type = "button";
          square.className = `square ${(rank + file) % 2 === 0 ? "light" : "dark"}`;
          square.dataset.square = squareName;
          square.setAttribute("aria-label", squareName);

          if (selected === squareName) square.classList.add("selected");
          if (legalTargets.includes(squareName)) {
            square.classList.add(piece ? "capture" : "legal");
          }
          if (piece) {
            square.textContent = pieceSymbols[piece.color][piece.type];
            square.classList.add(piece.color === "w" ? "piece-white" : "piece-black");
          }

          square.addEventListener("click", () => handleSquare(squareName));
          boardEl.appendChild(square);
        }
      }

      renderStatus();
      renderStats();
      renderMoves();
    }

    function handleSquare(squareName) {
      if (!game || game.isGameOver() || game.turn() !== "w") return;

      const piece = game.get(squareName);
      if (!selected) {
        if (piece && piece.color === "w") selectSquare(squareName);
        return;
      }

      const move = game.move({ from: selected, to: squareName, promotion: "q" });
      if (move) {
        selected = null;
        legalTargets = [];
        render();
        window.setTimeout(playAiMove, 260);
      } else if (piece && piece.color === "w") {
        selectSquare(squareName);
      } else {
        selected = null;
        legalTargets = [];
        render();
      }
    }

    function selectSquare(squareName) {
      selected = squareName;
      legalTargets = game.moves({ square: squareName, verbose: true }).map((move) => move.to);
      render();
    }

    function playAiMove() {
      if (game.isGameOver()) {
        finishGame();
        render();
        return;
      }

      const move = getBestMove(Number(levelEl.value));
      if (move) game.move(move);
      finishGame();
      render();
    }

    function getBestMove(level) {
      const moves = game.moves({ verbose: true });
      if (moves.length === 0) return null;
      if (level === 1) return moves[Math.floor(Math.random() * moves.length)];
      if (level === 2) return chooseGreedyMove(moves);
      return chooseMinimaxMove(moves, 2);
    }

    function chooseGreedyMove(moves) {
      let best = moves[0];
      let bestScore = Infinity;
      for (const move of moves) {
        game.move(move);
        const score = evaluateBoard();
        game.undo();
        if (score < bestScore) {
          bestScore = score;
          best = move;
        }
      }
      return best;
    }

    function chooseMinimaxMove(moves, depth) {
      let best = moves[0];
      let bestScore = Infinity;
      for (const move of moves) {
        game.move(move);
        const score = minimax(depth - 1, -Infinity, Infinity, true);
        game.undo();
        if (score < bestScore) {
          bestScore = score;
          best = move;
        }
      }
      return best;
    }

    function minimax(depth, alpha, beta, maximizing) {
      if (depth === 0 || game.isGameOver()) return evaluateBoard();
      const moves = game.moves({ verbose: true });

      if (maximizing) {
        let value = -Infinity;
        for (const move of moves) {
          game.move(move);
          value = Math.max(value, minimax(depth - 1, alpha, beta, false));
          game.undo();
          alpha = Math.max(alpha, value);
          if (beta <= alpha) break;
        }
        return value;
      }

      let value = Infinity;
      for (const move of moves) {
        game.move(move);
        value = Math.min(value, minimax(depth - 1, alpha, beta, true));
        game.undo();
        beta = Math.min(beta, value);
        if (beta <= alpha) break;
      }
      return value;
    }

    function evaluateBoard() {
      if (game.isCheckmate()) return game.turn() === "w" ? -999999 : 999999;
      if (game.isDraw()) return 0;

      let score = 0;
      for (const row of game.board()) {
        for (const piece of row) {
          if (!piece) continue;
          const value = pieceValues[piece.type];
          score += piece.color === "w" ? value : -value;
        }
      }
      return score;
    }

    function finishGame() {
      if (!game.isGameOver() || recorded) return;
      recorded = true;
      stats.games += 1;
      if (game.isCheckmate()) {
        if (game.turn() === "b") stats.wins += 1;
        else stats.losses += 1;
      } else {
        stats.draws += 1;
      }
      stats.level = adaptLevel();
      levelEl.value = String(stats.level);
      saveStats();
    }

    function renderStatus() {
      if (game.isCheckmate()) {
        statusEl.textContent = game.turn() === "b" ? "Сіз жеңдіңіз" : "AI жеңді";
        hintEl.textContent = "Жаңа ойын бастауға болады.";
      } else if (game.isDraw()) {
        statusEl.textContent = "Тең ойын";
        hintEl.textContent = "Пат, қайталау немесе материал жеткіліксіз.";
      } else if (game.isCheck()) {
        statusEl.textContent = game.turn() === "w" ? "Сізге шах" : "AI-ға шах";
        hintEl.textContent = game.turn() === "w" ? "Ақ фигурамен қорғаныңыз." : "AI жүріс жасап жатыр.";
      } else {
        statusEl.textContent = game.turn() === "w" ? "Сіздің жүрісіңіз" : "AI ойланып жатыр";
        hintEl.textContent = "Фигураны, сосын жүретін ұяшықты басыңыз.";
      }
    }

    function renderStats() {
      statEls.games.textContent = stats.games;
      statEls.wins.textContent = stats.wins;
      statEls.losses.textContent = stats.losses;
      statEls.draws.textContent = stats.draws;
    }

    function renderMoves() {
      movesEl.innerHTML = "";
      for (const move of game.history()) {
        const item = document.createElement("li");
        item.textContent = move;
        movesEl.appendChild(item);
      }
    }

    levelEl.addEventListener("change", () => {
      stats.level = Number(levelEl.value);
      saveStats();
    });

    newGameEl.addEventListener("click", createGame);

    clearStatsEl.addEventListener("click", () => {
      stats = { games: 0, wins: 0, losses: 0, draws: 0, level: 1 };
      saveStats();
      createGame();
    });

    createGame();
  </script>
</body>
</html>
